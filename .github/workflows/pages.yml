name: Deploy BURZH website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install screenshot tooling
        run: |
          npm install --no-save playwright@1.55.0 sharp@0.34.4
          npx playwright install --with-deps chromium

      - name: Capture real application interfaces
        run: node scripts/capture.mjs assets/projects

      - name: Assemble static site
        run: |
          rm -rf _site
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp .nojekyll _site/.nojekyll
          cp -R assets/projects _site/assets/projects

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
